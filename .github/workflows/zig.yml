name: Zig

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zig-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.7.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Format check
        run: zig build fmt-check

      - name: Build workspace
        run: zig build

      - name: Test workspace
        run: zig build test --summary all

  # The schema packages are checked in, so the thing worth proving is that
  # they are what the generator produces from the pinned corpora: this
  # catches a hand-edit, a stale package after an emitter change, and any
  # non-determinism, all with one diff. Linux only: 196 paths in the
  # Swordfish bundle differ only by case, so it cannot even be unpacked on
  # the macOS and Windows runners.
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.7.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Regenerate every schema package
        run: zig build -Dcorpora generate

      # `git diff` alone would not notice a package that was never added.
      - name: The checked-in packages must match
        run: |
          git add -A -- schema_packages
          git --no-pager diff --cached --stat -- schema_packages
          git diff --cached --exit-code --quiet -- schema_packages
